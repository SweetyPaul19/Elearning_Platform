{% extends 'teachers_master.html' %}
{% load static %}

{% block content %}

<div class="main-panel">
    <div class="content-wrapper">

        <div class="page-header">
            <h3 class="page-title">
                My Batch
            </h3>
        </div>

        <div class="row">

            {% for c in my_batches %}

            <div class="col-md-4 mb-4">
                <div class="card">

                    <div class="card-body">

                        <h4 class="card-title">
                            {{ c.name }}
                        </h4>

                        <p class="card-text">
                            Course ID: {{ c.id }}
                        </p>

                    </div>

                </div>
            </div>

            {% empty %}

            <div class="col-12">
                <div class="alert alert-info">
                    No courses have been assigned to you yet.
                </div>
            </div>

            {% endfor %}

        </div>

    </div>
</div>

{% endblock %}
