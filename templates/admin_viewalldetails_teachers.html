{% extends 'admin_master.html' %}
{% load static %}

{% block content %}

<div class="row">
    <div class="col-lg-12 grid-margin stretch-card">
        <div class="card">
        <div class="card-body">
            <h4 class="card-title">All Teachers</h4>
        
            <table class="table table-striped">
            <thead>
                <tr>
                
                <th>name</th>
                <th> phone no. </th>
                    <th> email </th>
                    
                <th> photo</th>
                    <th> Edit</th>
                <th>Delete</th>
                <th>assign course</th>
                </tr>
            </thead>
                {% for i in Teacher %}
                <tr>
                        <td>{{i.name}}</td>
                        <td>{{i.phone}}</td>
                        <td>{{i.email}}</td>
                        
                        <td><img src="media/{{i.file}}" alt="" width="100px" height="100px"></td>
                        <td><a href="addteachers_edit/{{i.id}}">edit</a></td>
                        <td><a href="addteachers_delete/{{i.id}}">Delete</a></td>
                        <td><a href="course_assign/{{i.id}}">Assign</a></td>
                    </tr>
                {% endfor %}
            
            
            </table>
        </div>
        </div>
    </div>
</div>

{% endblock %}
