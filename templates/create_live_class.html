{% extends 'teachers_master.html' %}
{% load static %}

{% block content %}

<div class="main-panel">
    <div class="content-wrapper">

        <div class="page-header">
            <h3 class="page-title">
                Create Live Class
            </h3>
        </div>

        <div class="card">
            <div class="card-body">

                <h4 class="card-title">
                    {{ batche.name }}
                </h4>

                <p class="card-description">
                    Schedule a live class
                </p>

                <form method="post">

                    {% csrf_token %}

                    <div class="form-group">
                        <label>Class Title</label>

                        <input
                            type="text"
                            name="title"
                            class="form-control"
                            placeholder="Enter live class title"
                            required>
                    </div>

                    <div class="form-group">
                        <label>Date</label>

                        <input
                            type="date"
                            name="scheduled_date"
                            class="form-control"
                            required>
                    </div>

                    <div class="form-group">
                        <label>Start Time</label>

                        <input
                            type="time"
                            name="start_time"
                            class="form-control"
                            required>
                    </div>

                    <div class="form-group">
                        <label>End Time</label>

                        <input
                            type="time"
                            name="end_time"
                            class="form-control"
                            required>
                    </div>

                    <button
                        type="submit"
                        class="btn btn-gradient-primary me-2">

                        Create Live Class

                    </button>

                    <a
                        href="/teacher_view_batch/{{ batche.id }}"
                        class="btn btn-light">

                        Cancel

                    </a>

                </form>

            </div>
        </div>

    </div>
</div>
<script src="https://unpkg.com/@zegocloud/zego-uikit-prebuilt/zego-uikit-prebuilt.js"></script>
{% endblock %}
