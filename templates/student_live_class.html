</div>

<!-- ZEGOCLOUD UIKit -->

<script src="https://unpkg.com/@zegocloud/zego-uikit-prebuilt/zego-uikit-prebuilt.js"></script>

<script>

async function joinLiveClass() {

    try {

        // Request student ZEGOCLOUD token
        const response = await fetch(
            "{% url 'generate_student_zego_token' live_class.id %}"
        );

        const data = await response.json();

        if (!data.success) {

            alert(data.message);
            return;

        }

        // Get information from Django
        const token = data.token;
        const appID = data.app_id;
        const roomID = data.room_id;
        const userID = data.user_id;
        const userName = data.user_name;


        console.log("ZEGOCLOUD App ID:", appID);
        console.log("Room ID:", roomID);
        console.log("Student ID:", userID);


        // Generate Kit Token
        const kitToken =
            ZegoUIKitPrebuilt.generateKitTokenForProduction(
                appID,
                token,
                roomID,
                userID,
                userName
            );


        // Create ZEGOCLOUD instance
        const zp = ZegoUIKitPrebuilt.create(kitToken);


        // Join classroom
        zp.joinRoom({

            container:
                document.querySelector("#zego-container"),

            scenario: {

                mode:
                    ZegoUIKitPrebuilt.VideoConference

            },

            // Student settings
            showPreJoinView: true,

            turnOnCameraWhenJoining: false,

            turnOnMicrophoneWhenJoining: false,

            showScreenSharingButton: false,

            showTextChat: true,

            showUserList: true

        });

    }

    catch (error) {

        console.error(
            "ZEGOCLOUD STUDENT ERROR:",
            error
        );

        alert(
            "Unable to join the live class."
        );

    }

}


// Start
joinLiveClass();

</script>
